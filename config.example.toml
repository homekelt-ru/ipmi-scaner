# Скопируйте в config.toml (или /etc/ipmi-scanner/config.toml) и поправьте.

[scan]
# Сети с BMC: CIDR, диапазоны (10.0.0.1-10.0.0.50 или 10.0.0.1-50), одиночные IP.
networks = ["192.168.1.0/24"]
# Интервал планового скана в минутах; 0 — только вручную.
interval_minutes = 60
# Сколько ждать ответа после рассылки (сек) и сколько раз переспрашивать молчащих.
timeout = 1.5
retries = 1
# Скорость рассылки, пакетов/сек (на каждый адрес уходит 2 пакета).
rate = 1000
# Запрашивать https://<bmc>/redfish/v1/ (без логина) для определения производителя и модели.
redfish = true
redfish_timeout = 3.0

[web]
# По умолчанию панель доступна только локально (используйте SSH-туннель).
# Если открываете наружу — обязательно задайте пароль.
listen = "127.0.0.1"
port = 8623
username = "admin"
password = ""

[storage]
database = "./data/ipmi.db"

[bmc]
# Учётные данные по умолчанию для BMC без собственных (задаются в панели). Пусто — только свои.
username = ""
password = ""
timeout = 15.0
max_parallel = 8
